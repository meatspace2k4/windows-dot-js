<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

<body>
<canvas id="screen" tabindex="0"></canvas>
<!-- The screen from the page's first moment: MS-DOS's text screen as the machine shows it when it starts ("Starting
     Windows 95..." on its first line, the cursor on the next), drawn by the page itself while its scripts arrive (the
     system's bundle is most of them, and the machine's disk and its text font are in it, so the machine itself cannot
     draw before then). It is taken away when the shell has started and draws the machine's own screen (win95.js). -->
<div id="bootText" aria-hidden="true"><pre>
Starting Windows 95...
<span>_</span></pre></div>
<style>
  #bootText { position: fixed; inset: 0; z-index: 1; background: #000; pointer-events: none; overflow: hidden; }
  #bootText pre { position: absolute; left: 50%; top: 50%; width: 720px; height: 400px; margin: 0; transform: translate(-50%, -50%) scale(var(--boot-x, 1), var(--boot-y, 1));
    font: 16px/16px "Perfect DOS VGA 437", "Px437 IBM VGA9", "Lucida Console", "Courier New", monospace; color: #aaa; letter-spacing: 0; }
  #bootText span { animation: bootCursor 1s steps(1) infinite; }
  @keyframes bootCursor { 50% { opacity: 0; } }
</style>
<script>
// (the text screen's 720 by 400 stretched over the window, as the shell draws the machine's; gone once the shell is up and
// draws: win95.js makes window.win95 as it starts, whose screen() says what it shows)
(function bootText() {
  const el = document.getElementById('bootText'); if (!el) return;
  const fit = () => { el.style.setProperty('--boot-x', String(Math.max(0.1, innerWidth / 720))); el.style.setProperty('--boot-y', String(Math.max(0.1, innerHeight / 400))); };
  fit(); addEventListener('resize', fit);
  const gone = () => { removeEventListener('resize', fit); el.remove(); };
  // (until the shell shows a screen of the machine's: its state no longer 'black', or a while after it started)
  let up = 0;
  (function wait() {
    const w = window.win95; if (w && !up) up = performance.now();
    let state = 'black'; try { if (w) state = w.screen().screen; } catch (_) { /* not yet */ }
    if (w && (state !== 'black' || performance.now() - up > 15000)) requestAnimationFrame(() => requestAnimationFrame(gone)); else requestAnimationFrame(wait);
  })();
})();
</script>

<script>
// Build metadata (<meta name="build-*">), written by deploy/win95/deploy.sh stamp_build_meta; the source copy, which
// localhost serves, reads as a dev build of the working tree. A dev build (localhost or win95-dev) shows the DEVELOPER
// banner and the [DEV <sig>] title and runs without the service worker, so it never runs a cached copy; only a prod
// build installs it. All of it is written as text (textContent / document.title), never parsed as HTML.
(function initBuildMetadata() {
  const meta = n => { const el = document.querySelector(`meta[name="build-${n}"]`); return el ? String(el.getAttribute('content') || '') : ''; };
  const b = Object.freeze({ channel: meta('channel'), sig: meta('sig'), version: meta('version'), commit: meta('commit'), date: meta('date') });
  window.__BUILD__ = b;
  const sw = 'serviceWorker' in navigator && location.protocol !== 'file:';
  if (b.channel !== 'dev') {
    if (sw) navigator.serviceWorker.register('sw.js');
    return;
  }
  if (sw) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (self.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});

  document.title = `[DEV ${b.sig}] ${document.title}`;
  const banner = document.createElement('div');
  banner.id = 'devBanner';
  banner.textContent = `DEVELOPER ${b.sig}`;
  banner.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:2147483647;pointer-events:none;background:#ff3b30;color:#fff;font:700 12px/1.7 ui-monospace,Menlo,monospace;padding:2px 12px;border-radius:0 0 6px 6px;letter-spacing:.04em;white-space:nowrap';
  document.body.prepend(banner);

  // Deployed dev only: every 20 s fetch the page past the browser cache and reload when a newer dev deploy is being
  // served (its build-sig differs). The working tree has no deploys to wait for, so localhost skips it.
  if (b.sig === 'local') return;
  setInterval(() => {
    fetch(location.pathname + '?devcheck=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
      .then(r => r.text())
      .then(html => {
        const el = new DOMParser().parseFromString(html, 'text/html').querySelector('meta[name="build-sig"]');
        const sig = el ? el.getAttribute('content') : null;
        if (sig && sig !== b.sig) location.reload();
      })
      .catch(() => {});
  }, 20000);
})();
</script>
